# Expect true 24bit color support
#set -g default-terminal "wezterm"
#set -sa terminal-overrides ",wezterm:Tc"
##set -as terminal-features ",$TERM:Tc"
##set -as terminal-features ",wezterm:Tc"
set -g default-terminal "xterm-256color"
set -sa terminal-overrides ",xterm-256color:Tc"
# Trying to get sixel images to show correctly
#set-option -g allow-passthrough on
#set -as terminal-features 'contour:sixel'
# Have an easy way to reload this config
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded"
#
# Have a large window line history
set-option -g history-limit 10000
# Set for Vi like keys
set-window-option -g mode-keys vi
# Help nvim and other quickkey commands work as expected
set-option -sg escape-time 100
# Use control + spacebar as the prefix for tmux command mode
unbind C-Space
set -g prefix C-Space
set -g prefix2 C-b
bind C-Space send-prefix
# Start nubmering with a 1
set -g base-index 1
setw -g pane-base-index 1
# When theres a gap in the window's number renumber them
set -g renumber-windows on
# Change the status bar color
#set -g status-bg "#584452"
# Remove date from statusline
#set -g status-right "#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}#{user}@#{host} \"#{=21:pane_title}\" %H:%M"
# Inverse the colors for the current window
#set -g window-status-current-style reverse
# Status bar position
set-option -g status-position top

set -g mouse on

# ----------------------
# Basic Status bar options
set -g status-interval 1
set -g status-justify left # Powerline often looks best left-justified for the window list
set -g status-bg "#584452" # Use default terminal background for full transparency if desired
set -g status-fg white # Default text color

# Status Left: Session Name | User@Host
set -g status-left-length 100
set -g status-left '#[fg=colour232,bg=colour238] #{session_name} #[fg=colour238,bg=colour241,nobold,nounderscore,noitalics]#[fg=colour232,bg=colour241] #{pane_index} #[fg=colour241,bg=#584452,nobold,nounderscore,noitalics]'

# Window Status (Centered)
setw -g window-status-separator ""
setw -g status-justify centre

# Non-active Window Styling
#setw -g window-status-format '#[fg=colour247,bg=colour236] #I:#W #[fg=colour236,bg=colour235,nobold,nounderscore,noitalics]'
setw -g window-status-format '#[fg=colour246] #I:#W '
# Current Window Styling
setw -g window-status-current-format '#[fg=colour234,bg=#584452,bold]#[fg=colour30,bg=colour234,bold] #I:#W #[fg=colour234,bg=#584452,nobold,nounderscore,noitalics]'

# Status Right: Load Averages | Date & Time
set -g status-right-length 100
set -g status-right '#[fg=colour241,bg=#584452,nobold,nounderscore,noitalics]#[fg=colour232,bg=colour241] #{user}@#{host_short} #[fg=colour238,bg=colour241,nobold,nounderscore,noitalics]#[fg=colour232,bg=colour238] %H:%M #[fg=colour235,bg=default,nobold,nounderscore,noitalics]'

# Custom segment (optional) - for example, for prefix-highlight (requires plugin)
# set -g status-right "#{prefix_highlight} | #{online_status} | #{battery_status_fg} #{battery_status_bg} #{battery_status} | #{cpu_usage} | %a %h %d %H:%M"
